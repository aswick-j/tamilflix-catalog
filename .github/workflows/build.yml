name: Build TamilFlix catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static addon
        env:
          TMDB_READ_ACCESS_TOKEN: \${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          MDBLIST_API_KEY: \${{ secrets.MDBLIST_API_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
